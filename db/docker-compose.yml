# K-Evolution 로컬 개발용 MySQL
# application.properties 설정값에 맞춰둠 (127.0.0.1:3306, root/1234, DB명 k-evolution)
# 실행:   docker compose -f db/docker-compose.yml up -d
# 중지:   docker compose -f db/docker-compose.yml down
# 초기화: docker compose -f db/docker-compose.yml down -v   (데이터 볼륨까지 삭제)
services:
  mysql:
    image: mysql:8.4
    container_name: MysqlDB
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "k-evolution"
      TZ: "Asia/Seoul"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - k-evolution-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p1234"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  k-evolution-mysql-data:
