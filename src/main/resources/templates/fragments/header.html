<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/products}">K-Evolution</a>
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link" th:href="@{/cart}" sec:authorize="isAuthenticated()">장바구니</a>
            <a class="nav-link" th:href="@{/orders}" sec:authorize="isAuthenticated()">주문내역</a>
            <a class="nav-link" th:href="@{/admin/products}" sec:authorize="hasRole('ADMIN')">관리자</a>
            <a class="nav-link" th:href="@{/auth/login}" sec:authorize="isAnonymous()">로그인</a>
            <a class="nav-link" th:href="@{/auth/signup}" sec:authorize="isAnonymous()">회원가입</a>
            <form th:action="@{/auth/logout}" method="post"
                  sec:authorize="isAuthenticated()" class="d-inline ms-2">
                <button class="btn btn-sm btn-outline-light" type="submit">로그아웃</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
